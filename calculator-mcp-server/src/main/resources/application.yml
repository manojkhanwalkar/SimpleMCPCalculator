# Stdout is the MCP channel: no banner, no console logging, no web server.
spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    mcp:
      server:
        name: calculator-mcp-server
        version: 1.0.0
        stdio: true
        type: sync
        # Only tools are offered; don't advertise empty prompt/resource/completion capabilities.
        capabilities:
          prompt: false
          resource: false
          completion: false
        instructions: "Calculator tools: add, subtract, multiply, divide, remainder and exponent on two numbers (a, b); factorial, isPrime and parity (even/odd) on one whole number (n)."

logging:
  threshold:
    console: off
  # Per-user directory rather than the shared temp dir, where another local user could
  # pre-create or read the file. The application's main() creates it owner-only (0700/0600)
  # and falls back to a private temp dir if the home directory is not writable.
  # Override with --logging.file.name=...
  file:
    name: ${user.home}/.calculator-mcp/calculator-mcp-server.log
