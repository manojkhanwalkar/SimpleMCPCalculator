# Publishes a GitHub Release with the five executable jars when a version tag (v*) is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Only a tag on a commit that is already on master (so went through a reviewed PR) is released.
# The build job runs with a read-only token; only the small publish job, which runs no project
# code, can write to the repository.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release jars
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tagged commit to be on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on master; not releasing."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          # No dependency cache: a release is built from a clean download.

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Collect jars and checksums
        run: |
          set -euo pipefail
          mkdir dist
          cp calculator-mcp-server/target/calculator-mcp-server.jar \
             calculator-mcp-client/target/calculator-mcp-client.jar \
             calculator-router-client/target/calculator-router-client.jar \
             ScientificCalculatorMCP/scientific-calculator-mcp-server/target/scientific-calculator-mcp-server.jar \
             ScientificCalculatorMCP/scientific-calculator-mcp-client/target/scientific-calculator-mcp-client.jar \
             dist/
          (cd dist && sha256sum *.jar > SHA256SUMS)

      - name: Upload jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-jars
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-jars
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
