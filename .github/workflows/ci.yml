name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify builds both server jars (including ScientificCalculatorMCP) before the client and
      # router end-to-end tests run against them, and fails if a module's JaCoCo line or branch
      # coverage drops below the gate in the parent poms (coverage.*.minimum)
      - name: Build, test and check coverage
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Unit-test coverage (JaCoCo)"
            .github/scripts/coverage-summary.sh
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
